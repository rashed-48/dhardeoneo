# Fly.io — https://fly.io/docs/reference/configuration/
# Deploy:
#   fly launch --no-deploy
#   fly secrets set DATABASE_URL=... SHELF_SECRET=...
#   fly deploy
#
# State lives in Postgres, so no volume is required. Mount one only if cover art
# fetched after deploy should survive a restart.
app = "shelf"
primary_region = "sin"   # Singapore is the closest region to Dhaka

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  SHELF_DATA_DIR = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
